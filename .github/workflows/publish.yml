name: Publish libraries

# protocol and client go to GitHub Packages on a tag. JitPack builds the same tags for anyone
# without a token, so consumers can pick either.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # v4 for the same reason as CI: v3 asks for a package Google no longer publishes.
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      # Checked here rather than taken on trust: a tag can name a commit no CI run has touched, and
      # what this job writes to the package registry cannot be unpublished.
      - run: ./gradlew :protocol:check :client:check :protocol:publish :client:publish
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
