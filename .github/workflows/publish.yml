name: Publish libraries

# protocol and client go to GitHub Packages on a tag. JitPack builds the same tags for anyone
# without a token, so consumers can pick either.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # v4 for the same reason as CI: v3 asks for a package Google no longer publishes.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # GitHub Packages will not let an existing version be overwritten, so a stray v* tag would
      # leave an artifact here that only a manual delete from the package page can clean up.
      - name: Check the tag is a release version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a vX.Y.Z release tag" >&2
            exit 1
          fi
      # Checked here rather than taken on trust: a tag can name a commit no CI run has touched, and
      # what this job writes to the package registry cannot be unpublished.
      - run: ./gradlew :protocol:check :client:check :protocol:publish :client:publish
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
