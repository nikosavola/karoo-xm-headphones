name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push that supersedes a running build cancels it rather than running both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Not ubuntu-latest: GitHub starts moving that label to Ubuntu 26 in October 2026, and a build
    # image changing under the workflow is not something to find out about from a red run.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Matching the pin in gradle/gradle-daemon-jvm.properties leaves the toolchain resolver
          # with nothing to download.
          java-version: '21'
      # v4 rather than v3. v3 asks sdkmanager for the legacy `tools` package, which Google no longer
      # publishes, so it fails before the build starts: every run of this workflow has died there.
      # v4 asks for platform-tools, which is still there, and pins node24.
      #
      # Nothing else is named on purpose. Gradle downloads the platform and build tools the modules
      # ask for, and the runner image has their licences accepted already.
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      # `check` and not just `test`: the library modules' lint gate is part of it, and a lint
      # failure there has no other way of showing up (the app still builds and the tests still pass).
      # The kover tasks depend on their module's test task, so this runs every suite once and
      # writes the reports Codecov and SonarCloud read. protocol is a plain JVM module, so its
      # report has no variant suffix; client and app run their Robolectric tests as debug unit tests.
      - run: ./gradlew check :app:assembleDebug :protocol:koverXmlReport :client:koverXmlReportDebug :app:koverXmlReportDebug
      # The tests draw into app/build/screenshots and never over the tracked copies, so this compares
      # what was just rendered against what is committed. A difference is reported rather than failed
      # on: the committed images were recorded on macOS and this runner's rendering has never been
      # compared with it, so a red build here would be about two rasterizers disagreeing rather than
      # about anything wrong with the code.
      - name: Report screenshot drift
        run: |
          # Absent is not the same as different, and the two need telling apart: the tests write
          # these images themselves, so a green build can in principle finish without any. Absence is
          # an error annotation rather than a failed step for the same reason a difference is only a
          # warning, since this runner cannot be checked against the machine that recorded them.
          if [ ! -d app/build/screenshots ]; then
            echo "::error::nothing was rendered into app/build/screenshots, so nothing was compared"
            exit 0
          fi
          if ! diff --recursive --brief docs/screenshots app/build/screenshots; then
            echo "::warning::the committed screenshots differ from the ones just rendered"
          fi
      # secrets is not allowed in an `if`, so the presence check is a step output. Until the token
      # is configured the uploads are skipped rather than failing on an empty token.
      - id: codecov
        run: echo "present=${{ secrets.CODECOV_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # Reporting, not a gate: Codecov's own outages must not fail a build whose tests passed.
      - name: Upload coverage to Codecov
        if: steps.codecov.outputs.present == 'true'
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: protocol/build/reports/kover/report.xml,client/build/reports/kover/reportDebug.xml,app/build/reports/kover/reportDebug.xml
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.codecov.outputs.present == 'true' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: protocol/build/test-results/test/*.xml,client/build/test-results/testDebugUnitTest/*.xml,app/build/test-results/testDebugUnitTest/*.xml
