name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A private repo pays per minute, so a push that supersedes a running build cancels it rather than
# paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matching the pin in gradle/gradle-daemon-jvm.properties leaves the toolchain resolver
          # with nothing to download.
          java-version: '21'
      # v4 rather than v3. v3 asks sdkmanager for the legacy `tools` package, which Google no longer
      # publishes, so it fails before the build starts: every run of this workflow has died there.
      # v4 asks for platform-tools, which is still there, and pins node24.
      #
      # Nothing else is named on purpose. Gradle downloads the platform and build tools the modules
      # ask for, and the runner image has their licences accepted already.
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      # `check` and not just `test`: the library modules' lint gate is part of it, and a lint
      # failure there has no other way of showing up (the app still builds and the tests still pass).
      - run: ./gradlew check :app:assembleDebug
      # The tests draw into app/build/screenshots and never over the tracked copies, so this compares
      # what was just rendered against what is committed. A difference is reported rather than failed
      # on: the committed images were recorded on macOS and this runner's rendering has never been
      # compared with it, so a red build here would be about two rasterizers disagreeing rather than
      # about anything wrong with the code.
      - name: Report screenshot drift
        run: |
          # Absent is not the same as different, and the two need telling apart: the tests write
          # these images themselves, so a green build can in principle finish without any. Absence is
          # an error annotation rather than a failed step for the same reason a difference is only a
          # warning, since this runner cannot be checked against the machine that recorded them.
          if [ ! -d app/build/screenshots ]; then
            echo "::error::nothing was rendered into app/build/screenshots, so nothing was compared"
            exit 0
          fi
          if ! diff --recursive --brief docs/screenshots app/build/screenshots; then
            echo "::warning::the committed screenshots differ from the ones just rendered"
          fi
