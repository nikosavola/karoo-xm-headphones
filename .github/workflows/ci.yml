name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # `check` and not just `test`: the library modules' lint gate is part of it, and a lint
      # failure there has no other way of showing up (the app still builds and the tests still pass).
      - run: ./gradlew check :app:assembleDebug
