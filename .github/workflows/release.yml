name: Release

# The APK riders install by sideload, attached to a GitHub release. The library publication is a
# separate workflow; this one is about the app.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      # A release signed with anything else cannot replace the previous one on a Karoo, so a tag
      # with no key configured is an error rather than a debug-signed build that looks fine.
      - name: Put the signing key in place
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::the release signing secrets are not configured, so this tag cannot make an APK riders can install over the last one"
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - run: ./gradlew :app:check :app:assembleRelease
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
            --title "$GITHUB_REF_NAME" --generate-notes
